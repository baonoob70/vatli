<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mô Phỏng Thí Nghiệm Ma Sát Tĩnh Điện</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #0f172a;
      color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .lab-card {
      background-color: #1e293b;
      border: 1px solid #334155;
      border-radius: 16px;
      width: 100%;
      max-width: 800px;
      padding: 24px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
    }

    .header {
      border-bottom: 1px solid #334155;
      padding-bottom: 16px;
      margin-bottom: 20px;
    }

    .header h1 {
      font-size: 1.5rem;
      color: #38bdf8;
    }

    .simulation-area {
      position: relative;
      width: 100%;
      height: 320px;
      background-color: #020617;
      border: 2px dashed #475569;
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 20px;
      cursor: crosshair;
    }

    /* Thước nhựa */
    .ruler {
      position: absolute;
      width: 220px;
      height: 40px;
      background: rgba(56, 189, 248, 0.2);
      border: 2px solid #38bdf8;
      border-radius: 6px;
      top: 50px;
      left: 50px;
      display: flex;
      align-items: center;
      justify-content: space-around;
      user-select: none;
      box-shadow: 0 0 15px rgba(56, 189, 248, 0.2);
      z-index: 10;
    }

    /* Vải dạ / Vải len */
    .cloth {
      position: absolute;
      width: 120px;
      height: 120px;
      background-color: #b91c1c;
      border: 2px solid #ef4444;
      border-radius: 12px;
      top: 150px;
      left: 500px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-weight: bold;
      color: #fef2f2;
      user-select: none;
      box-shadow: 0 0 15px rgba(239, 68, 68, 0.3);
      z-index: 5;
    }

    /* Vụ giấy */
    .paper-piece {
      position: absolute;
      width: 12px;
      height: 12px;
      background-color: #f1f5f9;
      border-radius: 2px;
      transition: transform 0.1s ease-out;
    }

    /* Bảng thông số / Điều khiển */
    .controls {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      background-color: #0f172a;
      padding: 16px;
      border-radius: 8px;
    }

    .stat-box {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .stat-label {
      font-size: 0.875rem;
      color: #94a3b8;
    }

    .stat-value {
      font-size: 1.25rem;
      font-weight: bold;
      color: #38bdf8;
    }

    .charge-bar-container {
      width: 100%;
      height: 10px;
      background-color: #334155;
      border-radius: 5px;
      overflow: hidden;
      margin-top: 6px;
    }

    .charge-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #38bdf8, #ef4444);
      transition: width 0.2s ease;
    }

    .instructions {
      margin-top: 16px;
      font-size: 0.9rem;
      color: #94a3b8;
      line-height: 1.5;
    }

    .btn-reset {
      grid-column: span 2;
      padding: 10px;
      background-color: #334155;
      color: #fff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      transition: background-color 0.2s;
    }

    .btn-reset:hover {
      background-color: #475569;
    }
  </style>
</head>
<body>

  <div class="lab-card">
    <div class="header">
      <h1>⚡ Thí Nghiệm Ma Sát Tĩnh Điện</h1>
    </div>

    <div class="simulation-area" id="simArea">
      <!-- Thước nhựa -->
      <div class="ruler" id="ruler">
        <span style="font-size: 12px; color: #38bdf8;">Thước Nhựa</span>
      </div>

      <!-- Mảnh vải -->
      <div class="cloth" id="cloth">Vải Dạ</div>

      <!-- Vụ giấy sẽ được tạo bằng JS -->
    </div>

    <div class="controls">
      <div class="stat-box">
        <span class="stat-label">Điện tích tích tụ (Q):</span>
        <span class="stat-value" id="chargeText">0 µC</span>
        <div class="charge-bar-container">
          <div class="charge-bar" id="chargeBar"></div>
        </div>
      </div>

      <div class="stat-box">
        <span class="stat-label">Trạng thái mảnh giấy:</span>
        <span class="stat-value" id="paperStatusText" style="color: #94a3b8;">Bình thường</span>
      </div>

      <button class="btn-reset" onclick="resetLab()">Đặt Lại Thí Nghiệm</button>
    </div>

    <div class="instructions">
      💡 <b>Hướng dẫn:</b> Kéo <b>Thước Nhựa</b> chà xát liên tục vào <b>Mảnh Vải</b> để tích điện tĩnh. Sau đó, đưa thước lại gần các <b>mảnh giấy</b> ở góc dưới để xem lực hút tĩnh điện!
    </div>
  </div>

  <script>
    const ruler = document.getElementById('ruler');
    const cloth = document.getElementById('cloth');
    const simArea = document.getElementById('simArea');
    const chargeText = document.getElementById('chargeText');
    const chargeBar = document.getElementById('chargeBar');
    const paperStatusText = document.getElementById('paperStatusText');

    let charge = 0; // Điện tích (0 -> 100)
    let isDragging = false;
    let dragOffset = { x: 0, y: 0 };
    let lastPos = { x: 0, y: 0 };
    
    // Tạo danh sách mảnh giấy ngẫu nhiên ở khu vực dưới
    const papers = [];
    const paperCount = 15;

    function initPapers() {
      // Xóa các giấy cũ nếu có
      document.querySelectorAll('.paper-piece').forEach(el => el.remove());
      papers.length = 0;

      for (let i = 0; i < paperCount; i++) {
        const paper = document.createElement('div');
        paper.className = 'paper-piece';
        
        // Tọa độ ngẫu nhiên ở góc dưới bên trái
        const x = 50 + Math.random() * 200;
        const y = 230 + Math.random() * 50;
        
        paper.style.left = `${x}px`;
        paper.style.top = `${y}px`;
        
        simArea.appendChild(paper);
        papers.push({ element: paper, originX: x, originY: y, isAttracted: false });
      }
    }

    // Xử lý kéo thả thước
    ruler.addEventListener('mousedown', (e) => {
      isDragging = true;
      const rect = ruler.getBoundingClientRect();
      dragOffset.x = e.clientX - rect.left;
      dragOffset.y = e.clientY - rect.top;
    });

    window.addEventListener('mousemove', (e) => {
      if (!isDragging) return;

      const simRect = simArea.getBoundingClientRect();
      let x = e.clientX - simRect.left - dragOffset.x;
      let y = e.clientY - simRect.top - dragOffset.y;

      // Giới hạn trong vùng sim
      x = Math.max(0, Math.min(x, simRect.width - 220));
      y = Math.max(0, Math.min(y, simRect.height - 40));

      ruler.style.left = `${x}px`;
      ruler.style.top = `${y}px`;

      // TÍNH MA SÁT VỚI VẢI
      checkFriction(x, y);

      // KÍCH THÍCH HÚT GIẤY
      checkPaperAttraction(x, y);
    });

    window.addEventListener('mouseup', () => {
      isDragging = false;
    });

    // Kiểm tra va chạm / ma sát giữa thước và vải
    function checkFriction(rulerX, rulerY) {
      const clothRect = cloth.getBoundingClientRect();
      const simRect = simArea.getBoundingClientRect();

      const clothX = clothRect.left - simRect.left;
      const clothY = clothRect.top - simRect.top;

      // Kiểm tra xem thước có đè lên vải không
      const isOverlapping = 
        rulerX < clothX + 120 &&
        rulerX + 220 > clothX &&
        rulerY < clothY + 120 &&
        rulerY + 40 > clothY;

      if (isOverlapping) {
        // Tính khoảng cách di chuyển để tăng điện tích
        const dist = Math.hypot(rulerX - lastPos.x, rulerY - lastPos.y);
        if (dist > 2) {
          charge = Math.min(100, charge + dist * 0.15);
          updateChargeUI();
        }
      }
      lastPos = { x: rulerX, y: rulerY };
    }

    // Kiểm tra và hút vụ giấy
    function checkPaperAttraction(rulerX, rulerY) {
      const rulerCenter = { x: rulerX + 110, y: rulerY + 20 };
      let attractedCount = 0;

      papers.forEach(p => {
        const dist = Math.hypot(p.originX - rulerCenter.x, p.originY - rulerCenter.y);

        // Khoảng cách hút phụ thuộc vào điện tích (charge)
        const attractRadius = (charge / 100) * 120;

        if (dist < attractRadius && charge > 15) {
          // Hút mảnh giấy về phía thước
          const angle = Math.atan2(rulerCenter.y - p.originY, rulerCenter.x - p.originX);
          const moveDist = Math.min(dist, attractRadius - dist + 20);
          
          p.element.style.transform = `translate(${Math.cos(angle) * moveDist}px, ${Math.sin(angle) * moveDist}px) rotate(${charge * 2}deg)`;
          p.isAttracted = true;
          attractedCount++;
        } else {
          // Trở về vị trí cũ
          p.element.style.transform = `translate(0, 0) rotate(0deg)`;
          p.isAttracted = false;
        }
      });

      if (attractedCount > 0) {
        paperStatusText.textContent = `Đang bị hút (${attractedCount} mảnh)`;
        paperStatusText.style.color = '#38bdf8';
      } else {
        paperStatusText.textContent = 'Bình thường';
        paperStatusText.style.color = '#94a3b8';
      }
    }

    function updateChargeUI() {
      chargeText.textContent = `${Math.round(charge)} µC`;
      chargeBar.style.width = `${charge}%`;
    }

    function resetLab() {
      charge = 0;
      updateChargeUI();
      ruler.style.left = '50px';
      ruler.style.top = '50px';
      paperStatusText.textContent = 'Bình thường';
      paperStatusText.style.color = '#94a3b8';
      initPapers();
    }

    // Khởi tạo ban đầu
    initPapers();
  </script>
</body>
</html>
