<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Phòng thí nghiệm Vật lí 12</title><script src="https://cdn.tailwindcss.com"></script><style>body{font-family:Inter,system-ui,sans-serif;background:#f7f5f0;color:#1a1a1a}.card{background:#fff;border:1px solid #e5e7eb;border-radius:16px;box-shadow:0 5px 20px #0000000d}iframe{width:100%;height:calc(100vh - 190px);min-height:650px;border:0;border-radius:14px}</style></head><body class="min-h-screen p-4 sm:p-8"><main class="max-w-7xl mx-auto"><header class="flex flex-col md:flex-row justify-between md:items-end gap-4 mb-5 pb-5 border-b border-gray-300"><div><span class="bg-red-600 text-white text-xs font-bold uppercase tracking-wider px-3 py-1 rounded">Vật lí 12 • Phòng thí nghiệm</span><h1 class="text-3xl sm:text-5xl font-black mt-3">Mô phỏng thí nghiệm vật lí.</h1><p class="text-gray-600 mt-2">Chọn một thí nghiệm để bắt đầu quan sát và tương tác.</p></div><label class="font-bold text-sm min-w-64">CHỌN THÍ NGHIỆM<select id="experiment" class="block w-full mt-1 p-3 rounded-lg border border-gray-300 bg-white focus:ring-2 focus:ring-red-500"><option value="thermal">1. Nhiệt học & chuyển thể</option><option value="electric">2. Tĩnh điện</option></select></label></header><section class="card p-2 sm:p-4"><iframe id="viewer" title="Thí nghiệm vật lí"></iframe></section></main><script>const viewer=document.getElementById('viewer'),select=document.getElementById('experiment');function openExperiment(){viewer.src=select.value==='thermal'?'nhiet-hoc.html':'dien-tich.html'}select.addEventListener('change',openExperiment);openExperiment();</script></body></html>
