<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mô Phỏng Tĩnh Điện</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #111827; color: #f3f4f6; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 20px; }
    h1 { margin-bottom: 8px; font-size: 24px; color: #f9fafb; }
    p.desc { margin-bottom: 20px; font-size: 14px; color: #9ca3af; text-align: center; max-width: 650px; }
    canvas { background: #1f2937; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); cursor: grab; touch-action: none; }
    canvas:active { cursor: grabbing; }
    .controls { margin-top: 15px; display: flex; gap: 15px; }
    button.action-btn { background: #3b82f6; color: #ffffff; border: none; padding: 10px 20px; font-weight: 600; border-radius: 8px; cursor: pointer; transition: background 0.2s; }
    button.action-btn:hover { background: #2563eb; }
  </style>
</head>
<body>
  <h1>Thí Nghiệm Tĩnh Điện (Electrostatics)</h1>
  <p class="desc">Kéo <b>Bóng bay</b> cọ xát vào <b>Áo len</b> để nhận Electron, sau đó thả ra gần <b>Bức tường</b> để xem lực hút tĩnh điện!</p>
  <canvas id="simCanvas" width="800" height="450"></canvas>
  <div class="controls"><button class="action-btn" id="resetBtn">Đặt Lại Thí Nghiệm</button></div>

  <script>
    const canvas = document.getElementById('simCanvas');
    const ctx = canvas.getContext('2d');
    const sweaterImg = new Image();
    const balloonImg = new Image();
    sweaterImg.src = './1790256541776.png';
    balloonImg.src = './1790256519761.png';

    const sweater = { x: 70, y: 100, w: 180, h: 250, charges: [] };
    const wall = { x: 630, y: 50, w: 110, h: 350, charges: [] };
    const balloon = { x: 380, y: 200, r: 45, vx: 0, vy: 0, negativeCharges: 0, isDragging: false };
    const PHYSICS = { maxTransferDistance: 12, polarizationDistance: 220, damping: 0.86, maxSpeed: 5.5 };

    function initCharges() {
      sweater.charges = [];
      wall.charges = [];
      Object.assign(balloon, { x: 380, y: 200, vx: 0, vy: 0, negativeCharges: 0, isDragging: false });

      for (let i = 0; i < 20; i++) {
        sweater.charges.push({
          x: sweater.x + 30 + Math.random() * (sweater.w - 60),
          y: sweater.y + 30 + Math.random() * (sweater.h - 60),
          hasElectron: true
        });
      }
      for (let r = 0; r < 7; r++) for (let c = 0; c < 3; c++) {
        const x = wall.x + 20 + c * 35;
        const y = wall.y + 30 + r * 45;
        wall.charges.push({ baseX: x, baseY: y, pX: x, pY: y, eX: x + 12, eY: y });
      }
    }

    function drawPlus(x, y) {
      ctx.strokeStyle = '#ef4444'; ctx.lineWidth = 3; ctx.beginPath();
      ctx.moveTo(x - 5, y); ctx.lineTo(x + 5, y); ctx.moveTo(x, y - 5); ctx.lineTo(x, y + 5); ctx.stroke();
    }
    function drawMinus(x, y) {
      ctx.strokeStyle = '#3b82f6'; ctx.lineWidth = 3; ctx.beginPath();
      ctx.moveTo(x - 5, y); ctx.lineTo(x + 5, y); ctx.stroke();
    }

    let dragOffsetX = 0, dragOffsetY = 0;
    function canvasPoint(clientX, clientY) {
      const rect = canvas.getBoundingClientRect();
      return { x: (clientX - rect.left) * canvas.width / rect.width, y: (clientY - rect.top) * canvas.height / rect.height };
    }
    function handleStart(clientX, clientY) {
      const p = canvasPoint(clientX, clientY);
      if (Math.hypot(p.x - balloon.x, p.y - balloon.y) <= balloon.r) {
        balloon.isDragging = true; balloon.vx = 0; balloon.vy = 0;
        dragOffsetX = p.x - balloon.x; dragOffsetY = p.y - balloon.y;
      }
    }
    function handleMove(clientX, clientY) {
      if (!balloon.isDragging) return;
      const p = canvasPoint(clientX, clientY);
      balloon.x = p.x - dragOffsetX; balloon.y = p.y - dragOffsetY;
      keepBalloonInBounds();
    }
    function handleEnd() { balloon.isDragging = false; }
    canvas.addEventListener('mousedown', e => handleStart(e.clientX, e.clientY));
    window.addEventListener('mousemove', e => handleMove(e.clientX, e.clientY));
    window.addEventListener('mouseup', handleEnd);
    canvas.addEventListener('touchstart', e => { if (e.touches[0]) handleStart(e.touches[0].clientX, e.touches[0].clientY); }, { passive: true });
    window.addEventListener('touchmove', e => { if (e.touches[0]) handleMove(e.touches[0].clientX, e.touches[0].clientY); }, { passive: true });
    window.addEventListener('touchend', handleEnd);

    function keepBalloonInBounds() {
      balloon.x = Math.max(balloon.r, Math.min(wall.x - balloon.r, balloon.x));
      balloon.y = Math.max(balloon.r, Math.min(canvas.height - balloon.r, balloon.y));
    }
    function updatePolarization() {
      wall.charges.forEach(pair => {
        const dx = pair.baseX - balloon.x, dy = pair.baseY - balloon.y;
        const dist = Math.hypot(dx, dy);
        const targetElectronX = pair.baseX + 12, targetElectronY = pair.baseY;
        if (balloon.negativeCharges && dist < PHYSICS.polarizationDistance) {
          // Electron bị đẩy ra xa bóng; điện tích dương còn lại ở phía gần bóng.
          const amount = (1 - dist / PHYSICS.polarizationDistance) * Math.min(18, 4 + balloon.negativeCharges * 0.8);
          const nx = dist ? dx / dist : 1, ny = dist ? dy / dist : 0;
          pair.eX = pair.baseX + 12 + nx * amount;
          pair.eY = pair.baseY + ny * amount;
        } else {
          pair.eX += (targetElectronX - pair.eX) * 0.12;
          pair.eY += (targetElectronY - pair.eY) * 0.12;
        }
      });
    }
    function update() {
      if (balloon.isDragging) {
        sweater.charges.forEach(q => {
          if (q.hasElectron && Math.hypot(balloon.x - q.x, balloon.y - q.y) <= balloon.r + PHYSICS.maxTransferDistance) {
            q.hasElectron = false;
            balloon.negativeCharges++;
          }
        });
      }
      updatePolarization();
      if (!balloon.isDragging && balloon.negativeCharges > 0) {
        let fx = 0, fy = 0;
        // Điện tích dương trên áo len hút bóng về đúng vị trí của áo, không hút về tâm cố định.
        sweater.charges.forEach(q => {
          if (!q.hasElectron) {
            const dx = q.x - balloon.x, dy = q.y - balloon.y, d2 = dx * dx + dy * dy;
            const d = Math.sqrt(d2) || 1;
            if (d < 360) { const force = Math.min(0.12, 0.018 / Math.max(0.25, d / 100)); fx += dx / d * force; fy += dy / d * force; }
          }
        });
        // Hút về mặt tường gần nhất; lực luôn hướng vào tường và giảm khi đã sát tường.
        const targetX = wall.x - balloon.r;
        const gap = targetX - balloon.x;
        if (gap > 0 && gap < 260) {
          const force = Math.min(0.28, (balloon.negativeCharges * 0.012) / Math.max(25, gap));
          fx += force * 18;
        }
        balloon.vx = Math.max(-PHYSICS.maxSpeed, Math.min(PHYSICS.maxSpeed, (balloon.vx + fx) * PHYSICS.damping));
        balloon.vy = Math.max(-PHYSICS.maxSpeed, Math.min(PHYSICS.maxSpeed, (balloon.vy + fy) * PHYSICS.damping));
        balloon.x += balloon.vx; balloon.y += balloon.vy;
        keepBalloonInBounds();
        if (balloon.x >= targetX - 1) { balloon.x = targetX; balloon.vx = 0; }
      }
    }

    function render() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      if (sweaterImg.complete && sweaterImg.naturalWidth) ctx.drawImage(sweaterImg, sweater.x, sweater.y, sweater.w, sweater.h);
      else { ctx.fillStyle = '#374151'; ctx.beginPath(); ctx.roundRect(sweater.x, sweater.y, sweater.w, sweater.h, 16); ctx.fill(); }
      sweater.charges.forEach(q => { drawPlus(q.x, q.y); if (q.hasElectron) drawMinus(q.x + 8, q.y); });
      ctx.fillStyle = '#4b5563'; ctx.fillRect(wall.x, wall.y, wall.w, wall.h);
      ctx.fillStyle = '#9ca3af'; ctx.font = '14px sans-serif'; ctx.fillText('Bức Tường', wall.x + 20, wall.y - 10);
      wall.charges.forEach(pair => { drawPlus(pair.pX, pair.pY); drawMinus(pair.eX, pair.eY); });
      ctx.save(); ctx.beginPath(); ctx.arc(balloon.x, balloon.y, balloon.r, 0, Math.PI * 2); ctx.clip();
      if (balloonImg.complete && balloonImg.naturalWidth) ctx.drawImage(balloonImg, balloon.x - balloon.r, balloon.y - balloon.r, balloon.r * 2, balloon.r * 2);
      else { ctx.fillStyle = '#f97316'; ctx.fill(); }
      ctx.restore();
      for (let i = 0; i < balloon.negativeCharges; i++) { const angle = (i / 15) * Math.PI * 2; const rad = (i > 15 ? 0.6 : 0.3) * balloon.r; drawMinus(balloon.x + Math.cos(angle) * rad, balloon.y + Math.sin(angle) * rad); }
      requestAnimationFrame(() => { update(); render(); });
    }
    document.getElementById('resetBtn').addEventListener('click', initCharges);
    initCharges(); render();
  </script>
</body>
</html>
