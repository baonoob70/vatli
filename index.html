<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mô Phỏng Tĩnh Điện: Áo Len & Bong Bóng</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #111827;
      color: #f3f4f6;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    h1 { margin-bottom: 8px; font-size: 24px; color: #f9fafb; }
    p.desc { margin-bottom: 20px; font-size: 14px; color: #9ca3af; text-align: center; max-width: 650px; }

    canvas {
      background: #1f2937;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      cursor: grab;
      touch-action: none;
    }
    canvas:active { cursor: grabbing; }

    .controls {
      margin-top: 15px;
      display: flex;
      gap: 15px;
    }
    button.action-btn {
      background: #3b82f6;
      color: #ffffff;
      border: none;
      padding: 10px 20px;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s;
    }
    button.action-btn:hover { background: #2563eb; }
  </style>
</head>
<body>

  <h1>Thí Nghiệm Tĩnh Điện (Electrostatics)</h1>
  <p class="desc">
    Kéo <b>Bóng bay</b> cọ xát vào <b>Áo len</b> để nhận Electron, sau đó thả ra gần <b>Bức tường</b> hoặc <b>Áo len</b> để xem lực hút!
  </p>

  <canvas id="simCanvas" width="800" height="450"></canvas>

  <div class="controls">
    <button class="action-btn" id="resetBtn">Đặt Lại Thí Nghiệm</button>
  </div>

  <script>
    const canvas = document.getElementById('simCanvas');
    const ctx = canvas.getContext('2d');

    // Nạp chính xác 2 tên ảnh từ GitHub
    const sweaterImg = new Image();
    const balloonImg = new Image();

    sweaterImg.src = './1790256541776.png';
    balloonImg.src = './1790256519761.png';

    // Cấu hình đối tượng
    const sweater = { x: 70, y: 100, w: 180, h: 250, charges: [] };
    const wall = { x: 630, y: 50, w: 110, h: 350, charges: [] };
    const balloon = { x: 380, y: 200, r: 45, vx: 0, vy: 0, negativeCharges: 0, isDragging: false };

    // Khởi tạo điện tích
    function initCharges() {
      sweater.charges = [];
      wall.charges = [];
      balloon.negativeCharges = 0;
      balloon.x = 380;
      balloon.y = 200;
      balloon.vx = 0;
      balloon.vy = 0;

      // Áo len chứa 20 cặp điện tích (+ -)
      for (let i = 0; i < 20; i++) {
        sweater.charges.push({
          x: sweater.x + 30 + Math.random() * (sweater.w - 60),
          y: sweater.y + 30 + Math.random() * (sweater.h - 60),
          hasElectron: true
        });
      }

      // Bức tường chứa lưới các cặp điện tích (+ -)
      for (let r = 0; r < 7; r++) {
        for (let c = 0; c < 3; c++) {
          wall.charges.push({
            baseX: wall.x + 20 + c * 35,
            baseY: wall.y + 30 + r * 45,
            pX: wall.x + 20 + c * 35,
            pY: wall.y + 30 + r * 45,
            eX: wall.x + 20 + c * 35 + 12,
            eY: wall.y + 30 + r * 45
          });
        }
      }
    }

    // Vẽ dấu cộng (+) MÀU ĐỎ TƯƠI ĐỂ KHÔNG TRÙNG MÀU BÓNG
    function drawPlus(x, y) {
      ctx.strokeStyle = '#ff4d4d';
      ctx.lineWidth = 3.5;
      ctx.beginPath();
      ctx.moveTo(x - 6, y); ctx.lineTo(x + 6, y);
      ctx.moveTo(x, y - 6); ctx.lineTo(x, y + 6);
      ctx.stroke();
    }

    // Vẽ dấu trừ (-) MÀU XANH DƯƠNG
    function drawMinus(x, y) {
      ctx.strokeStyle = '#38bdf8';
      ctx.lineWidth = 3.5;
      ctx.beginPath();
      ctx.moveTo(x - 6, y); ctx.lineTo(x + 6, y);
      ctx.stroke();
    }

    // Tương tác kéo thả chuột / cảm ứng
    let dragOffsetX = 0, dragOffsetY = 0;

    function handleStart(clientX, clientY) {
      const rect = canvas.getBoundingClientRect();
      const mx = clientX - rect.left;
      const my = clientY - rect.top;
      const dist = Math.hypot(mx - balloon.x, my - balloon.y);

      if (dist < balloon.r) {
        balloon.isDragging = true;
        dragOffsetX = mx - balloon.x;
        dragOffsetY = my - balloon.y;
        balloon.vx = 0;
        balloon.vy = 0;
      }
    }

    function handleMove(clientX, clientY) {
      if (!balloon.isDragging) return;
      const rect = canvas.getBoundingClientRect();
      balloon.x = clientX - rect.left - dragOffsetX;
      balloon.y = clientY - rect.top - dragOffsetY;
    }

    function handleEnd() { balloon.isDragging = false; }

    canvas.addEventListener('mousedown', (e) => handleStart(e.clientX, e.clientY));
    window.addEventListener('mousemove', (e) => handleMove(e.clientX, e.clientY));
    window.addEventListener('mouseup', handleEnd);

    canvas.addEventListener('touchstart', (e) => {
      if (e.touches.length > 0) handleStart(e.touches[0].clientX, e.touches[0].clientY);
    });
    window.addEventListener('touchmove', (e) => {
      if (e.touches.length > 0) handleMove(e.touches[0].clientX, e.touches[0].clientY);
    });
    window.addEventListener('touchend', handleEnd);

    // Cập nhật mô phỏng vật lý ổn định
    function update() {
      // 1. Cọ xát -> Nhận Electron khi tiếp xúc áo len
      if (balloon.isDragging) {
        sweater.charges.forEach(q => {
          if (q.hasElectron) {
            const dist = Math.hypot(balloon.x - q.x, balloon.y - q.y);
            if (dist < balloon.r) {
              q.hasElectron = false;
              balloon.negativeCharges++;
            }
          }
        });
      }

      // 2. Phân cực điện tích bức tường
      wall.charges.forEach(pair => {
        const dist = Math.hypot(balloon.x - pair.baseX, balloon.y - pair.baseY);
        if (dist < 180 && balloon.negativeCharges > 0) {
          const angle = Math.atan2(pair.baseY - balloon.y, pair.baseX - balloon.x);
          const pushForce = Math.min(16, (1 - dist / 180) * 14 * (balloon.negativeCharges / 8));
          pair.eX = pair.baseX + Math.cos(angle) * pushForce;
          pair.eY = pair.baseY + Math.sin(angle) * pushForce;
        } else {
          pair.eX += (pair.baseX + 12 - pair.eX) * 0.1;
          pair.eY += (pair.baseY - pair.eY) * 0.1;
        }
      });

      // 3. Chuẩn hóa chuyển động của bóng (Tránh bay lung tung)
      if (!balloon.isDragging) {
        let fx = 0, fy = 0;

        // --- Lực hút về Áo len (Tích điện dương) ---
        const sweaterPositives = sweater.charges.filter(q => !q.hasElectron).length;
        if (sweaterPositives > 0 && balloon.negativeCharges > 0) {
          const sweaterCenterX = sweater.x + sweater.w / 2;
          const sweaterCenterY = sweater.y + sweater.h / 2;
          const dist = Math.hypot(sweaterCenterX - balloon.x, sweaterCenterY - balloon.y);

          // Chỉ tác dụng lực nếu bóng ở gần áo len (bán kính < 250px)
          if (dist < 250) {
            const pullStrength = 0.12 * (sweaterPositives / 10) * (balloon.negativeCharges / 10);
            fx += ((sweaterCenterX - balloon.x) / dist) * pullStrength;
            fy += ((sweaterCenterY - balloon.y) / dist) * pullStrength;
          }
        }

        // --- Lực hút về Bức tường (Do phân cực) ---
        if (balloon.negativeCharges > 0) {
          const distToWall = wall.x - (balloon.x + balloon.r);
          // Chỉ hút khi bóng ở khá gần tường (< 150px)
          if (distToWall > -20 && distToWall < 150) {
            const wallPull = 0.2 * (balloon.negativeCharges / 10);
            fx += wallPull;
          }
        }

        // Áp dụng gia tốc và Ma sát không khí (Giúp bóng dừng mịn màng)
        balloon.vx = (balloon.vx + fx) * 0.82;
        balloon.vy = (balloon.vy + fy) * 0.82;

        // Khống chế vận tốc tối đa
        const speed = Math.hypot(balloon.vx, balloon.vy);
        const maxSpeed = 6;
        if (speed > maxSpeed) {
          balloon.vx = (balloon.vx / speed) * maxSpeed;
          balloon.vy = (balloon.vy / speed) * maxSpeed;
        }

        // Cập nhật vị trí
        balloon.x += balloon.vx;
        balloon.y += balloon.vy;

        // Giới hạn biên không cho bóng văng ra khỏi màn hình
        balloon.x = Math.max(balloon.r, Math.min(wall.x - balloon.r, balloon.x));
        balloon.y = Math.max(balloon.r, Math.min(canvas.height - balloon.r, balloon.y));
      }
    }

    // Vẽ đồ họa Canvas
    function render() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // --- 1. VẼ ÁO LEN ---
      if (sweaterImg.complete && sweaterImg.naturalWidth !== 0) {
        ctx.drawImage(sweaterImg, sweater.x, sweater.y, sweater.w, sweater.h);
      } else {
        ctx.fillStyle = '#374151';
        ctx.beginPath();
        ctx.roundRect(sweater.x, sweater.y, sweater.w, sweater.h, 16);
        ctx.fill();
      }

      // Vẽ điện tích trên áo len
      sweater.charges.forEach(q => {
        drawPlus(q.x, q.y);
        if (q.hasElectron) drawMinus(q.x + 8, q.y);
      });

      // --- 2. VẼ BỨC TƯỜNG ---
      ctx.fillStyle = '#4b5563';
      ctx.fillRect(wall.x, wall.y, wall.w, wall.h);
      ctx.fillStyle = '#9ca3af';
      ctx.font = '14px sans-serif';
      ctx.fillText('Bức Tường', wall.x + 20, wall.y - 10);

      // Vẽ các cặp điện tích trên tường
      wall.charges.forEach(pair => {
        drawPlus(pair.pX, pair.pY);
        drawMinus(pair.eX, pair.eY);
      });

      // --- 3. VẼ BONG BÓNG ---
      ctx.save();
      if (balloonImg.complete && balloonImg.naturalWidth !== 0) {
        ctx.beginPath();
        ctx.arc(balloon.x, balloon.y, balloon.r, 0, Math.PI * 2);
        ctx.clip();
        ctx.drawImage(balloonImg, balloon.x - balloon.r, balloon.y - balloon.r, balloon.r * 2, balloon.r * 2);
      } else {
        ctx.beginPath();
        ctx.arc(balloon.x, balloon.y, balloon.r, 0, Math.PI * 2);
        ctx.fillStyle = '#f97316';
        ctx.fill();
        ctx.lineWidth = 2;
        ctx.strokeStyle = '#fdba74';
        ctx.stroke();
      }
      ctx.restore();

      // Vẽ Electron bám trên quả bóng
      for (let i = 0; i < balloon.negativeCharges; i++) {
        const angle = (i / 15) * Math.PI * 2;
        const rad = (i > 15 ? 0.6 : 0.35) * balloon.r;
        const ex = balloon.x + Math.cos(angle) * rad;
        const ey = balloon.y + Math.sin(angle) * rad;
        drawMinus(ex, ey);
      }

      requestAnimationFrame(() => {
        update();
        render();
      });
    }

    document.getElementById('resetBtn').addEventListener('click', initCharges);

    initCharges();
    render();
  </script>
</body>
</html>
