<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bảng Điều Khiển Thí Nghiệm Nhiệt Học</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --bg-dark: #121820;
      --card-bg: #1e2638;
      --card-border: rgba(255, 255, 255, 0.1);
      --text-main: #e2e8f0;
      --text-muted: #94a3b8;
      --hot-color: #ff4500;
      --cold-color: #00bfff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 24px;
      min-height: 100vh;
    }

    header {
      border-bottom: 1px solid var(--card-border);
      padding-bottom: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h1 {
      font-size: 1.5rem;
      letter-spacing: 1px;
      color: #ffffff;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .status-badge {
      font-size: 0.85rem;
      padding: 4px 12px;
      border-radius: 20px;
      background: rgba(0, 191, 255, 0.15);
      color: var(--cold-color);
      border: 1px solid var(--cold-color);
    }

    .grid-layout {
      display: grid;
      grid-template-columns: 280px 1fr 340px;
      gap: 20px;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
    }

    .card-title {
      font-size: 1rem;
      color: var(--text-muted);
      margin-bottom: 16px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* Nhiệt kế mô phỏng */
    .thermometer-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
    }

    .thermometer {
      width: 24px;
      height: 220px;
      background: rgba(255, 255, 255, 0.05);
      border: 2px solid var(--card-border);
      border-radius: 12px 12px 0 0;
      position: relative;
      display: flex;
      align-items: flex-end;
      padding: 3px;
    }

    .thermometer-fill {
      width: 100%;
      height: 25%;
      background: linear-gradient(to top, var(--cold-color), #ff8c00);
      border-radius: 8px 8px 0 0;
      transition: height 0.3s ease, background 0.3s ease;
    }

    .temp-display {
      font-size: 2.2rem;
      font-weight: bold;
      font-family: monospace;
      color: var(--cold-color);
      transition: color 0.3s ease;
    }

    /* Đồ thị */
    .chart-container {
      position: relative;
      height: 300px;
    }

    /* Control Panel */
    .controls {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .control-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .control-group label {
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--hot-color);
    }

    .btn-group {
      display: flex;
      gap: 10px;
      margin-top: 10px;
    }

    button {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-primary {
      background: var(--hot-color);
      color: white;
    }

    .btn-primary:hover {
      opacity: 0.9;
      box-shadow: 0 0 12px rgba(255, 69, 0, 0.4);
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.1);
      color: var(--text-main);
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.2);
    }
  </style>
</head>
<body>

  <header>
    <h1>🔥 Phòng Thí Nghiệm Nhiệt Học</h1>
    <span class="status-badge" id="statusBadge">Trạng thái: Ổn định</span>
  </header>

  <div class="grid-layout">
    <!-- Cột 1: Cảm biến Nhiệt kế -->
    <div class="card thermometer-container">
      <div class="card-title">Nhiệt Độ Hiện Tại</div>
      <div class="thermometer">
        <div class="thermometer-fill" id="tempFill"></div>
      </div>
      <div class="temp-display" id="tempValue">25.0 °C</div>
    </div>

    <!-- Cột 2: Đồ thị Thời gian thực -->
    <div class="card">
      <div class="card-title">Đồ Thị Biến Thiên Nhiệt Độ Theo Thời Gian (t)</div>
      <div class="chart-container">
        <canvas id="tempChart"></canvas>
      </div>
    </div>

    <!-- Cột 3: Bảng Bảng điều khiển -->
    <div class="card controls">
      <div class="card-title">Thông Số Thí Nghiệm</div>
      
      <div class="control-group">
        <label for="powerRange">Công suất gia nhiệt (W): <b id="powerVal">500 W</b></label>
        <input type="range" id="powerRange" min="100" max="2000" step="100" value="500">
      </div>

      <div class="control-group">
        <label for="massRange">Khối lượng chất lỏng (kg): <b id="massVal">1.0 kg</b></label>
        <input type="range" id="massRange" min="0.2" max="5.0" step="0.1" value="1.0">
      </div>

      <div class="btn-group">
        <button class="btn-primary" id="startBtn">Bắt đầu gia nhiệt</button>
        <button class="btn-secondary" id="resetBtn">Đặt lại</button>
      </div>
    </div>
  </div>

  <script>
    // Khởi tạo các biến trạng thái
    let currentTemp = 25.0;
    let isHeating = false;
    let timeStep = 0;
    let intervalId = null;

    // Element references
    const tempValueEl = document.getElementById('tempValue');
    const tempFillEl = document.getElementById('tempFill');
    const statusBadgeEl = document.getElementById('statusBadge');
    const startBtn = document.getElementById('startBtn');
    const resetBtn = document.getElementById('resetBtn');
    
    const powerRange = document.getElementById('powerRange');
    const powerVal = document.getElementById('powerVal');
    const massRange = document.getElementById('massRange');
    const massVal = document.getElementById('massVal');

    // Cập nhật giá trị Slider
    powerRange.addEventListener('input', (e) => powerVal.textContent = `${e.target.value} W`);
    massRange.addEventListener('input', (e) => massVal.textContent = `${e.target.value} kg`);

    // Khởi tạo đồ thị Chart.js
    const ctx = document.getElementById('tempChart').getContext('2d');
    const tempChart = new Chart(ctx, {
      type: 'line',
      data: {
        labels: [0],
        datasets: [{
          label: 'Nhiệt độ (°C)',
          data: [25.0],
          borderColor: '#00bfff',
          backgroundColor: 'rgba(0, 191, 255, 0.1)',
          fill: true,
          tension: 0.3
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        scales: {
          x: {
            title: { display: true, text: 'Thời gian (giây)', color: '#94a3b8' },
            ticks: { color: '#94a3b8' },
            grid: { color: 'rgba(255, 255, 255, 0.05)' }
          },
          y: {
            title: { display: true, text: 'Nhiệt độ (°C)', color: '#94a3b8' },
            ticks: { color: '#94a3b8' },
            grid: { color: 'rgba(255, 255, 255, 0.05)' },
            suggestedMin: 20,
            suggestedMax: 100
          }
        },
        plugins: {
          legend: { labels: { color: '#e2e8f0' } }
        }
      }
    });

    // Cập nhật giao diện nhiệt độ
    function updateUI(temp) {
      tempValueEl.textContent = `${temp.toFixed(1)} °C`;
      
      // Tính phần trăm cột nhiệt kế (20°C - 100°C)
      const fillPercentage = Math.min(Math.max(((temp - 20) / 80) * 100, 5), 100);
      tempFillEl.style.height = `${fillPercentage}%`;

      // Chuyển đổi màu sắc khi nhiệt độ tăng
      if (temp > 60) {
        const color = '#ff4500';
        tempValueEl.style.color = color;
        tempChart.data.datasets[0].borderColor = color;
        tempChart.data.datasets[0].backgroundColor = 'rgba(255, 69, 0, 0.1)';
      } else {
        const color = '#00bfff';
        tempValueEl.style.color = color;
        tempChart.data.datasets[0].borderColor = color;
        tempChart.data.datasets[0].backgroundColor = 'rgba(0, 191, 255, 0.1)';
      }
      tempChart.update('none');
    }

    // Vòng lặp đun nóng (Mô phỏng Q = m * c * dT => dT = P * dt / (m * c))
    function startHeating() {
      if (isHeating) {
        clearInterval(intervalId);
        isHeating = false;
        startBtn.textContent = 'Tiếp tục gia nhiệt';
        statusBadgeEl.textContent = 'Trạng thái: Tạm dừng';
        statusBadgeEl.style.color = '#ff8c00';
        return;
      }

      isHeating = true;
      startBtn.textContent = 'Tạm dừng';
      statusBadgeEl.textContent = 'Trạng thái: Đang gia nhiệt...';
      statusBadgeEl.style.color = 'var(--hot-color)';

      const c = 4184; // Nhiệt dung riêng của nước (J/kg.K)

      intervalId = setInterval(() => {
        if (currentTemp >= 100) {
          clearInterval(intervalId);
          isHeating = false;
          startBtn.textContent = 'Đạt điểm sôi!';
          statusBadgeEl.textContent = 'Trạng thái: Đạt điểm sôi (100°C)';
          return;
        }

        timeStep += 1;
        const P = parseFloat(powerRange.value);
        const m = parseFloat(massRange.value);
        
        // Tăng nhiệt độ
        const deltaT = P / (m * c);
        currentTemp += deltaT * 5; // Nhân hệ số để mô phỏng nhanh hơn

        // Cập nhật biểu đồ
        tempChart.data.labels.push(timeStep);
        tempChart.data.datasets[0].data.push(currentTemp);
        
        updateUI(currentTemp);
      }, 500);
    }

    // Đặt lại thí nghiệm
    function resetExperiment() {
      clearInterval(intervalId);
      isHeating = false;
      currentTemp = 25.0;
      timeStep = 0;

      startBtn.textContent = 'Bắt đầu gia nhiệt';
      statusBadgeEl.textContent = 'Trạng thái: Ổn định';
      statusBadgeEl.style.color = 'var(--cold-color)';

      tempChart.data.labels = [0];
      tempChart.data.datasets[0].data = [25.0];
      
      updateUI(currentTemp);
    }

    startBtn.addEventListener('click', startHeating);
    resetBtn.addEventListener('click', resetExperiment);
  </script>
</body>
</html>
