<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Thí nghiệm tĩnh điện</title><script src="https://cdn.tailwindcss.com"></script><style>body{font-family:Inter,system-ui,sans-serif;background:#f7f5f0;color:#1a1a1a}.panel{background:#fff;border:1px solid #e5e7eb;border-radius:16px;box-shadow:0 5px 20px #0001}canvas{display:block;width:100%;height:auto;background:#121212;border-radius:12px}</style></head><body class="p-4 sm:p-6"><main class="max-w-5xl mx-auto"><header class="mb-5"><span class="bg-red-600 text-white text-xs font-bold px-3 py-1 rounded">Vật lí 12 • Tĩnh điện</span><h1 class="text-3xl sm:text-4xl font-black mt-3">Tĩnh điện: cọ xát và phân cực.</h1><p class="text-gray-600 mt-2">Kéo bóng bay cọ xát vào áo len để nhận electron, sau đó đưa bóng lại gần bức tường.</p></header><section class="panel p-4 sm:p-6"><div class="grid grid-cols-2 gap-3 mb-4 p-3 bg-gray-50 rounded-lg text-center"><div><b class="text-xs text-gray-500 uppercase">Electron dư trên bóng</b><strong id="count" class="block text-2xl text-blue-600">0</strong></div><div><b class="text-xs text-gray-500 uppercase">Trạng thái</b><strong id="state" class="block text-2xl text-gray-900">Trung hòa</strong></div></div><canvas id="canvas" width="800" height="450"></canvas><button id="reset" class="mt-4 bg-gray-900 hover:bg-black text-white font-bold rounded-lg px-5 py-3">Đặt lại thí nghiệm</button></section></main><script>const c=document.getElementById('canvas'),x=c.getContext('2d'),s={x:70,y:100,w:180,h:250,q:[]},w={x:630,y:50,w:110,h:350,q:[]},b={x:380,y:200,r:45,n:0,vx:0,vy:0,drag:false};const si=new Image(),bi=new Image();si.src='./1790256541776.png';bi.src='./1790256519761.png';let ox=0,oy=0;function reset(){s.q=[];w.q=[];Object.assign(b,{x:380,y:200,n:0,vx:0,vy:0,drag:false});for(let i=0;i<20;i++)s.q.push({x:s.x+30+Math.random()*120,y:s.y+30+Math.random()*190,e:true});for(let r=0;r<7;r++)for(let j=0;j<3;j++){let X=w.x+20+j*35,Y=w.y+30+r*45;w.q.push({x:X,y:Y,ex:X+12,ey:Y})}}function pt(a,d){let z=c.getBoundingClientRect();return{x:(a-z.left)*800/z.width,y:(d-z.top)*450/z.height}}function clamp(){b.x=Math.max(b.r,Math.min(w.x-b.r,b.x));b.y=Math.max(b.r,Math.min(450-b.r,b.y))}function plus(X,Y){x.strokeStyle='#dc2626';x.lineWidth=3;x.beginPath();x.moveTo(X-5,Y);x.lineTo(X+5,Y);x.moveTo(X,Y-5);x.lineTo(X,Y+5);x.stroke()}function minus(X,Y){x.strokeStyle='#2563eb';x.lineWidth=3;x.beginPath();x.moveTo(X-5,Y);x.lineTo(X+5,Y);x.stroke()}function start(a,d){let p=pt(a,d);if(Math.hypot(p.x-b.x,p.y-b.y)<=b.r){b.drag=true;ox=p.x-b.x;oy=p.y-b.y}}function move(a,d){if(!b.drag)return;let p=pt(a,d);b.x=p.x-ox;b.y=p.y-oy;clamp()}c.onmousedown=e=>start(e.clientX,e.clientY);addEventListener('mousemove',e=>move(e.clientX,e.clientY));addEventListener('mouseup',()=>b.drag=false);c.ontouchstart=e=>start(e.touches[0].clientX,e.touches[0].clientY);addEventListener('touchmove',e=>move(e.touches[0].clientX,e.touches[0].clientY),{passive:true});addEventListener('touchend',()=>b.drag=false);function update(){if(b.drag)s.q.forEach(q=>{if(q.e&&Math.hypot(b.x-q.x,b.y-q.y)<57){q.e=false;b.n++}});w.q.forEach(q=>{let dx=q.x-b.x,dy=q.y-b.y,d=Math.hypot(dx,dy)||1;if(b.n&&d<220){let a=Math.min(18,4+b.n*.8);q.ex=q.x+12+dx/d*a;q.ey=q.y+dy/d*a}else{q.ex+=(q.x+12-q.ex)*.1;q.ey+=(q.y-q.ey)*.1}});if(!b.drag&&b.n){let fx=0,fy=0;s.q.forEach(q=>{if(!q.e){let dx=q.x-b.x,dy=q.y-b.y,d=Math.hypot(dx,dy)||1;fx+=dx/d*.025;fy+=dy/d*.025}});if(w.x-b.x<260)fx+=.08;b.vx=(b.vx+fx)*.86;b.vy=(b.vy+fy)*.86;b.x+=b.vx;b.y+=b.vy;clamp()}}function draw(){x.clearRect(0,0,800,450);x.fillStyle='#121212';x.fillRect(0,0,800,450);x.strokeStyle='#ffffff12';for(let i=0;i<800;i+=32){x.beginPath();x.moveTo(i,0);x.lineTo(i,450);x.stroke()}for(let i=0;i<450;i+=32){x.beginPath();x.moveTo(0,i);x.lineTo(800,i);x.stroke()}if(si.complete&&si.naturalWidth)x.drawImage(si,s.x,s.y,s.w,s.h);else{x.fillStyle='#374151';x.fillRect(s.x,s.y,s.w,s.h)}s.q.forEach(q=>{plus(q.x,q.y);if(q.e)minus(q.x+8,q.y)});x.fillStyle='#6b7280';x.fillRect(w.x,w.y,w.w,w.h);w.q.forEach(q=>{plus(q.x,q.y);minus(q.ex,q.ey)});x.save();x.beginPath();x.arc(b.x,b.y,b.r,0,Math.PI*2);x.clip();if(bi.complete&&bi.naturalWidth)x.drawImage(bi,b.x-b.r,b.y-b.r,90,90);else{x.fillStyle='#f59e0b';x.fill()}x.restore();for(let i=0;i<b.n;i++){let a=i*Math.PI*2/15,r=i>15?27:14;minus(b.x+Math.cos(a)*r,b.y+Math.sin(a)*r)}document.getElementById('count').textContent=b.n;document.getElementById('state').textContent=b.n?'Bóng tích điện âm':'Trung hòa';requestAnimationFrame(()=>{update();draw()})}document.getElementById('reset').onclick=reset;reset();draw();</script></body></html>
