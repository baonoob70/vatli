<!DOCTYPE html><html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Thí nghiệm nhiệt học</title><script src="https://cdn.tailwindcss.com"></script><script src="https://cdn.jsdelivr.net/npm/chart.js"></script><style>body{font-family:Inter,system-ui,sans-serif;background:#f7f5f0}.panel{background:#fff;border:1px solid #e5e7eb;border-radius:16px;box-shadow:0 5px 20px #0000000d}canvas{max-height:300px}</style></head><body class="min-h-screen p-4 sm:p-8"><main class="max-w-6xl mx-auto"><header class="mb-6"><span class="bg-red-600 text-white text-xs font-bold px-3 py-1 rounded">Vật lí 12 • Vật lí nhiệt</span><h1 class="text-4xl font-black mt-3">Thí nghiệm nhiệt học & chuyển thể</h1><p class="text-gray-600 mt-2">Quan sát nhiệt độ thay đổi khi đun nóng các chất và các giai đoạn chuyển thể.</p></header><section class="panel p-5"><div class="grid grid-cols-3 gap-3 bg-gray-50 p-4 rounded-lg text-center"><div><b class="text-gray-500">NHIỆT ĐỘ</b><strong id="temp" class="block text-2xl text-red-600">-20.0 °C</strong></div><div><b class="text-gray-500">THỜI GIAN</b><strong id="time" class="block text-2xl">0.0 s</strong></div><div><b class="text-gray-500">NHIỆT LƯỢNG</b><strong id="heat" class="block text-2xl text-amber-600">0.0 kJ</strong></div></div><div class="grid lg:grid-cols-2 gap-5 mt-5"><div class="bg-gray-900 rounded-xl p-6 text-white min-h-72 flex flex-col justify-end"><div id="matter" class="mx-auto w-40 h-28 rounded-lg bg-cyan-300/70 border-4 border-white/30"></div><div class="mx-auto mt-5 w-32 h-4 rounded-full bg-gradient-to-r from-red-700 via-amber-500 to-yellow-200"></div><p id="status" class="text-center text-gray-300 mt-4">Sẵn sàng đun nóng</p></div><div class="bg-gray-950 rounded-xl p-3"><canvas id="chart"></canvas></div></div><div class="grid md:grid-cols-4 gap-4 mt-6 items-end"><label class="font-bold">CHẤT<select id="sub" class="block w-full border rounded p-2 mt-1"><option value="water">Nước đá</option><option value="alcohol">Rượu ethanol</option><option value="copper">Đồng</option><option value="aluminum">Nhôm</option><option value="lead">Chì</option><option value="iron">Sắt</option><option value="oil">Dầu ăn</option><option value="glass">Thủy tinh</option></select></label><label class="font-bold">KHỐI LƯỢNG <span id="mv">0.5 kg</span><input id="mass" type="range" min=".1" max="2" step=".1" value=".5" class="block w-full"></label><label class="font-bold">CÔNG SUẤT <span id="pv">1000 W</span><input id="power" type="range" min="200" max="3000" step="100" value="1000" class="block w-full"></label><div class="flex gap-2"><button id="run" class="flex-1 bg-gray-900 text-white rounded p-2 font-bold">Bắt đầu đun</button><button id="reset" class="border rounded p-2 font-bold">Đặt lại</button></div></div></section></main><script>
const D={water:{n:'Nước đá',t:-20,m:0,c:2100,tm:0,l:334000,b:100,cl:4200},alcohol:{n:'Rượu ethanol',t:25,m:25,c:2500,b:78,cl:2500},copper:{n:'Đồng',t:25,m:25,c:380,tm:1083,l:205000},aluminum:{n:'Nhôm',t:25,m:25,c:880,tm:660,l:397000},lead:{n:'Chì',t:25,m:25,c:130,tm:327,l:25000},iron:{n:'Sắt',t:25,m:25,c:460,tm:1538,l:270000},oil:{n:'Dầu ăn',t:25,m:25,c:2000,b:220,cl:2000},glass:{n:'Thủy tinh',t:25,m:25,c:840}};let key='water',d=D[key],T=d.t,time=0,Q=0,running=false,id,phase='heat',mass=.5,power=1000;const $=id=>document.getElementById(id),chart=new Chart($('chart'),{type:'line',data:{datasets:[{data:[{x:0,y:T}],borderColor:'#ef4444',backgroundColor:'#ef444422',fill:true,pointRadius:0,tension:.15}]},options:{animation:false,parsing:false,scales:{x:{type:'linear',title:{display:true,text:'t (s)'}},y:{title:{display:true,text:'°C'}}},plugins:{legend:{display:false}}}});function reset(){stop();d=D[key];T=d.t;time=Q=0;phase='heat';chart.data.datasets[0].data=[{x:0,y:T}];chart.options.scales.y.min=d.t-10;chart.options.scales.y.max=Math.max(d.b||d.tm||d.t+100,d.t+50);chart.update();update()}function start(){if(running){stop();return}running=true;$('run').textContent='Tạm dừng';id=setInterval(tick,50)}function stop(){running=false;$('run').textContent='Bắt đầu đun';clearInterval(id)}function tick(){let dt=.6,dQ=power*dt;time+=dt;Q+=dQ;if(phase==='heat'){let target=d.tm??d.b??d.t+200;if(T<target){T+=dQ/(mass*d.c);if(T>=target){T=target;phase=d.tm!==undefined?'melt':d.b!==undefined?'boil':'done'}}}else if(phase==='melt'){T=d.tm;d._q=(d._q||0)+dQ;if(d._q>=mass*d.l)phase='heatLiquid'}else if(phase==='heatLiquid'){T+=dQ/(mass*(d.cl||d.c));if(T>=d.b){T=d.b;phase='boil'}}else if(phase==='boil'){T=d.b;if(d.L&&(d._q=(d._q||0)+dQ)>=mass*d.L)stop()}else stop();chart.data.datasets[0].data.push({x:time,y:T});chart.update();update()}function update(){$('temp').textContent=T.toFixed(1)+' °C';$('time').textContent=time.toFixed(1)+' s';$('heat').textContent=(Q/1000).toFixed(1)+' kJ';$('mv').textContent=mass.toFixed(1)+' kg';$('pv').textContent=power+' W';$('status').textContent=phase==='melt'?`Đang nóng chảy ở ${T.toFixed(1)}°C`:phase==='boil'?`Đang sôi ở ${T.toFixed(1)}°C`:phase==='done'?'Đã đạt nhiệt độ tối đa':`Đang đun ${d.n} (${T.toFixed(1)}°C)`;$('matter').style.background=`hsl(${Math.max(0,200-(T-d.t)*.18)},70%,65%)`}$('sub').onchange=e=>{key=e.target.value;reset()};$('mass').oninput=e=>{mass=+e.target.value;update()};$('power').oninput=e=>{power=+e.target.value;update()};$('run').onclick=start;$('reset').onclick=reset;reset();</script></body></html>
